name: CI

# A CI só valida. Quem publica é a integração da Vercel com o GitHub: push na
# master vai para produção e as outras branches viram preview.
on:
  push:
  workflow_dispatch:

# Um push novo na mesma branch cancela a validação antiga, que já não importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` é o `npm install` de CI: instala exatamente o que está no
      # package-lock.json e falha se ele estiver fora de sincronia.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
